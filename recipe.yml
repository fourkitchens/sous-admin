name: 'Sous Admin'
description: 'A recipe that contains modules, themes, and configuration for the Sous administration experience.'
type: 'Site'
recipes:
  # Install core recipes
  - core/recipes/core_recommended_performance
  - core/recipes/core_recommended_maintenance
install:
  # Install core dependencies.
  - node
  - toolbar
  - admin_toolbar
  - admin_toolbar_search
  - admin_toolbar_tools
  # Install Autosave Form.
  - autosave_form
  # Install Config log.
  - config_log
  # Install Gin theme and base modules that extend it.
  - gin
  - gin_toolbar
  # Install Entity Usuage
  - entity_usage
  # Install Field Group and dependencies
  - field_group
  # Install Conditional Fields
  - conditional_fields
  # Install Field UI
  - field_ui
  # Install Login Destination
  - login_destination
  # Install Login History
  - login_history
  # Install Media Library Edit
  - media_library_edit
  # Install Publication Date
  - publication_date
  # Install Save and Edit
  - save_edit
  # Install Trash.
  - trash
  # Install Views AJAX History
  - views_ajax_history
  # Install Views Bulk Operations
  - views_bulk_operations
config:
  import:
    admin_toolbar: '*'
    admin_toolbar_search: '*'
    admin_toolbar_tools: '*'
    gin:
      - gin.settings
      - block.block.gin_breadcrumbs
      - block.block.gin_content
      - block.block.gin_local_actions
      - block.block.gin_messages
      - block.block.gin_page_title
      - block.block.gin_primary_local_tasks
      - block.block.gin_secondary_local_tasks
    login_destination:
      - login_destination.destination.admins_and_editors_login_destination
  actions:
    # Update admin_toolbar settings
    admin_toolbar.settings:
      simple_config_update:
        menu_depth: 3
    # Update admin_toolbar_tools settings
    admin_toolbar_tools.settings:
      simple_config_update:
        max_bundle_number: 3
        hoverintent_functionality: false
    # Update autosave_form settings
    autosave_form.messages:
      entity_saved_in_background_alert_message: 'The content has been modified elsewhere. As a result, autosaving has been disabled and autosaved states for the current page have been deleted. Autosave will be reactivated after reloading the page.'
      langcode: en
    autosave_form.settings:
      interval: 60000
      only_on_form_change: false
      active_on:
        content_entity_forms: true
        config_entity_forms: false
      notification:
        active: true
        message: 'Saving draft...'
        delay: 1000
      allowed_content_entity_types: {  }
      allowed_new: true
      langcode: en
    # Set and unset Gin blocks.
    block.block.gin_admin:
      simple_config_update:
        status: false
    block.block.gin_branding:
      simple_config_update:
        status: false
    block.block.gin_local_actions:
      simple_config_update:
        region: content
        weight: -10
    block.block.gin_local_tasks:
      simple_config_update:
        status: false
    block.block.gin_page_title:
      simple_config_update:
        region: header
        weight: -10
    block.block.gin_primary_local_tasks:
      simple_config_update:
        region: header
        weight: -5
    block.block.gin_tools:
      simple_config_update:
        status: false
    # Update entity_usage
    entity_usage.settings:
      simple_config_update:
        track_enabled_base_fields: true
        local_task_enabled_entity_types:
          - media
    # Update gin settings
    gin.settings:
      simple_config_update:
        preset_accent_color: 'green'
        classic_toolbar: 'horizontal'
    # Update login_destination settings
    login_destination.settings:
      simple_config_update:
        preserve_destination: TRUE
    # Update the node settings to use the admin theme.
    node.settings:
      simple_config_update:
        use_admin_theme: true
    # Update save_edit settings
    save_edit.settings:
      simple_config_update:
        button_value: ''
        button_weight: '-10'
    # Update the admin theme to Gin in Theme settings.
    system.theme:
      simple_config_update:
        admin: gin
    # Update trash settings
    trash.settings:
      enabled_entity_types:
        file: {  }
        media: {  }
        node: {  }
        paragraph: {  }
      auto_purge:
        enabled: false
        after: null
